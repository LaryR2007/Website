<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset=UTF-8>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/mainpage.css">
    <title>Website Landing Page</title>
    <link rel="icon" type="image/x-icon" href="webimages/favicon.ico">
</head>
<body>
    <section class="showcase">
        <header>
            <h2 class="logo">Lary's portfolio</h2>
            <div class="toggle"></div>

        </header>

        <video width="400" muted loop autoplay controls>
            <source src="webimages/melanie.mp4" type="video/mp4">
            <source src="webimages/melanie.ogg" type="video/ogg">
        </video>

        <div class="overlay"></div>

        <div class="text">
            <h2>Welcome</h2>
            <h3>To My Porfolio</h3>
            <a href="home.html">Learn More</a>
        </div>

        <ul class="social">
            <li><a href="https://www.instagram.com/luv_mmandmarina"><img src="webimages/instagram.png" alt=""></li>
            <li><a href="https://github.com/LaryR2007"><img src="webimages/github.png" alt=""></li>
            <li><a href="https://www.linkedin.com/in/lary-renderos-193572334/"><img src="webimages/linkedin.png" alt=""></li>
        </ul>
    </section>

    <div class="menu">
        <ul>
            <li><a class="button" href="home.html">Homepage</a></li>
            <li><a class="button" href="awards.html">Awards & Certifications</a></li>
            <li><a class="button" href="education.html">Education</a></li>
            <li><a class="button" href="experience.html">Experience</a></li>
             <li><a class="button" href="contact.html">Contact</a></li>
        </ul>
    </div>

    <script>
        const menuToggle = document.querySelector('.toggle')
        const showcase = document.querySelector('.showcase')

            menuToggle.addEventListener('click',() => {
                menuToggle.classList.toggle('active')
                showcase.classList.toggle('active')
            })
    </script>
</body>
</html>
